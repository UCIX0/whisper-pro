name: whispert
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - ffmpeg
  - pip
  - pip:
    # Core Transcription
    - faster-whisper
    - ctranslate2
    
    # GPU Support
    - nvidia-cublas-cu12
    - nvidia-cudnn-cu12
    - torch 

    # Backend API (FastAPI)
    - fastapi
    - uvicorn[standard]
    - python-multipart
    - websockets

    # Utilities
    - tqdm
    - colorama
    - python-dotenv
